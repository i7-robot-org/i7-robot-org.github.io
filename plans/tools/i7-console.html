<!doctype html>
<title>Robot Work Station</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 布局：左侧工具导航 + 顶栏 + 视图区。现场工具深色，办公工具（数据与评测）浅色。 */
:root{
  color-scheme:dark;
  --bg:#F7F6F3;--s1:#FFFFFF;--s2:#F1EFEB;--line:#E7E4DF;
  --tx:#3A3B41;--tx2:#6B6C73;--tx3:#9A9BA1;
  --acc:#3E9E7C;--acct:#2F8467;--accbg:rgba(62,158,124,.16);
  --ok:#3E9E7C;--okt:#2F8467;--okbg:rgba(62,158,124,.14);
  --warn:#E2A33B;--warnt:#A8711A;--warnbg:rgba(226,163,59,.14);
  --err:#E0604E;--errt:#C2453A;--errbg:rgba(224,96,78,.14);
  --stop:#D9473A;--ser2:#F4917F;--ser2t:#F0A060;--onacc:#F7F6F3;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r1:6px;--r2:10px;--r3:14px;
}
.light{
  color-scheme:light;color:var(--tx);background:var(--bg);
  --bg:#F7F6F3;--s1:#FFFFFF;--s2:#F1EFEB;--line:#E7E4DF;
  --tx:#111827;--tx2:#4B5563;--tx3:#6B7280;
  --acc:#2F8467;--acct:#2F8467;--accbg:#E6F4EE;
  --ok:#2F8467;--okt:#2F8467;--okbg:#E7F5EC;
  --warn:#A8711A;--warnt:#A8711A;--warnbg:#FDF3DC;
  --err:#C2453A;--errt:#C2453A;--errbg:#FCE8E8;
  --ser2:#F4917F;--ser2t:#D9644F;--onacc:#FFFFFF;
}
html,body{height:100%}
body{background:#F7F6F3;color:#3A3B41;font-family:var(--sans);font-size:14px;margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{display:flex;height:100%;background:var(--bg);color:var(--tx)}
/* 侧栏 */
.side{width:212px;flex:none;background:#FFFFFF;border-right:1px solid #E7E4DF;display:flex;flex-direction:column;padding:16px 10px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.logo{width:36px;height:36px;border-radius:9px;background:#3E9E7C;color:#F7F6F3;font-family:var(--mono);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px}
.brand b{font-size:14px;white-space:nowrap}.brand small{display:block;color:#6B6C73;font-size:11px}
.grp{font-size:11px;letter-spacing:.08em;color:#9A9BA1;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 10px;border-radius:8px;color:#6B6C73;text-decoration:none;font-size:14px}
.nav:hover{background:#F1EFEB;color:#3A3B41}
.nav[aria-current="page"]{background:#F1EFEB;color:#3A3B41;font-weight:500}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2}
.nav[aria-current="page"] svg{stroke:#3E9E7C}
.nav .tag{margin-left:auto;font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:999px;background:#E7E4DF;color:#6B6C73}
.side .foot{margin-top:auto;padding:12px 4px 0;font-size:11px;color:#9A9BA1;line-height:1.6;display:flex;flex-direction:column;gap:8px}
.logo{font-size:12px!important;letter-spacing:.02em}
.nav[hidden]{display:none}
.nav.locked{opacity:.55}.nav.locked .tag::before{content:'🔒 '}
.uchip{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;background:#F1EFEB;color:#3A3B41}
.uchip .av{width:28px;height:28px;border-radius:50%;background:#3E9E7C;color:#F7F6F3;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.uchip b{font-size:13px;display:block}.uchip small{font-size:11px;color:#6B6C73}
.uchip button{margin-left:auto;height:26px;padding:0 8px;border-radius:6px;border:1px solid #E7E4DF;background:transparent;color:#6B6C73;font-size:11px}
.sw{display:flex;align-items:center;gap:8px;min-height:30px;padding:0 6px;border-radius:8px;border:none;background:transparent;color:#6B6C73;font-size:12px;text-align:left;width:100%}
.sw:hover{background:#F1EFEB;color:#3A3B41}
.sw i{width:28px;height:16px;border-radius:8px;background:#E7E4DF;position:relative;flex:none}
.sw i::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#6B6C73;transition:left .15s}
.pjw{position:relative;margin:2px 0 10px}
.pjsel{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:8px;row-gap:2px;padding:8px 10px;border-radius:10px;border:1px solid #E7E4DF;background:#FFFFFF;color:#3A3B41;text-align:left;font-size:13px}
.pjsel span{font-size:11px;color:#9A9BA1}.pjsel b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pjsel i{font-style:normal;color:#9A9BA1;grid-row:1/3;grid-column:3}
.pjsel:disabled{opacity:1;cursor:default}.pjsel:disabled i{display:none}
.pjpop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:#FFFFFF;border:1px solid #E7E4DF;border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.pjpop button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border:none;border-radius:8px;background:transparent;color:#3A3B41;text-align:left;font-size:13px}
.pjpop button:hover,.pjpop button[aria-pressed="true"]{background:#F1EFEB}.pjpop small{font-size:11px;color:#6B6C73}
.smp{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;background:#3A2F12;color:#A8711A;font-size:11px;font-weight:600;vertical-align:1px}
.light .smp{background:#FFF3D6;color:#8A5A00}
.capc{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;margin:0 6px 6px 0}
.capc.off{color:var(--tx3);text-decoration:line-through}
.fseg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;border-radius:8px;background:#FFFFFF}
.fseg button{height:28px;border:none;border-radius:6px;background:transparent;color:#6B6C73;font-size:12px}
.fseg button[aria-pressed="true"]{background:#E7E4DF;color:#fff;font-weight:700}
.login .fseg{background:#FFFFFF;border:1px solid #E7E4DF}.login .fseg button{height:36px;font-size:13px}
.sw[aria-pressed="true"]{color:#3A3B41}.sw[aria-pressed="true"] i{background:#3E9E7C}.sw[aria-pressed="true"] i::after{left:14px;background:#fff}
.login{position:fixed;inset:0;z-index:80;background:#F7F6F3;color:#3A3B41;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
.login .box{width:min(440px,100%);display:flex;flex-direction:column;gap:16px}
.login .acct{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid #E7E4DF;background:#FFFFFF;color:#3A3B41;text-align:left}
.login .acct:hover{border-color:#3E9E7C}.login .acct small{display:block;color:#6B6C73;font-size:12px}
.login .acct[aria-pressed="true"]{border:2px solid #3E9E7C;background:rgba(62,158,124,.12)}
.offl{max-width:620px;margin:40px auto;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.fgx{position:relative;border-radius:10px;overflow:hidden;background:#FFFFFF;border:1px solid #E7E4DF;color:#3A3B41}
.fgx .bar{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;background:#F7F6F3;border-bottom:1px solid #E7E4DF;font-size:12px}
.fgx .fgt{background:#F7F6F3;border:1px solid #E7E4DF;border-radius:6px}
/* 主区 */
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.top{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px 20px;border-bottom:1px solid #E7E4DF;background:#F7F6F3;color:#3A3B41;min-height:72px}
.top h1{margin:0;font-size:19px;font-weight:700;margin-right:6px}
.top .sp{flex:1}
.view{flex:1;min-height:0;overflow:auto;background:var(--bg);color:var(--tx)}
.pad{padding:16px max(16px,env(safe-area-inset-right,0px)) 24px 16px}
/* 通用 */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:13px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.p-ok{color:var(--okt);background:var(--okbg)}.p-warn{color:var(--warnt);background:var(--warnbg)}
.p-err{color:var(--errt);background:var(--errbg)}.p-info{color:var(--acct);background:var(--accbg)}
.p-idle{color:var(--tx2);background:rgba(107,108,115,.10)}
.card{background:var(--s1);border-radius:var(--r3);padding:14px 16px;min-width:0}
.light .top{background:#FFFFFF;color:var(--tx);border-bottom-color:var(--line)}
table{color:inherit;font-size:inherit}
.light .card{border:1px solid var(--line);border-radius:var(--r2)}
.ct{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ct b{font-size:14px}.ct span{font-size:12px;color:var(--tx2)}
.btn{height:44px;padding:0 16px;border-radius:var(--r1);border:1px solid var(--line);background:var(--s2);color:var(--tx);font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--tx3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:var(--err);color:var(--errt)}
.btn.warn{background:transparent;border-color:var(--warn);color:var(--warnt)}
.btn[disabled],.btn.locked{opacity:.55;cursor:not-allowed}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
.light .btn{height:40px}
.seg{display:inline-flex;background:var(--bg);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.light .seg{background:var(--s1);border:1px solid var(--line);padding:2px}
.seg button{height:38px;padding:0 14px;border-radius:6px;border:none;background:transparent;color:var(--tx2);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--s2);color:var(--tx);font-weight:700}
.light .seg button[aria-pressed="true"]{background:var(--acc);color:#fff}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:13px}
.kv>span:nth-child(odd){color:var(--tx2)}
.tile{background:var(--s2);border-radius:var(--r2);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.light .tile{background:var(--s1);border:1px solid var(--line)}
.tile .k{font-size:12px;color:var(--tx2)}.tile .v{font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;color:var(--tx2);font-weight:400}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.banner{display:flex;align-items:center;gap:12px;padding:10px 20px;font-size:14px;flex-wrap:wrap}
.banner.err{background:rgba(224,96,78,.14);border-bottom:1px solid #E0604E;color:#B23A2F}
.banner.warn{background:rgba(226,163,59,.12);border-bottom:1px solid #E2A33B;color:#8A5B12}
.banner.note{background:#F1EFEB;border-bottom:1px solid #E7E4DF;color:#3A3B41}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--tx2);padding:10px 12px;background:var(--s2)}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl .r{text-align:right}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r2);background:var(--s1)}
.sr{position:absolute;left:-9999px}
.g{display:grid;gap:12px}
/* 解锁、停止 */
.unlock{position:relative;overflow:hidden;height:46px;padding:0 16px;border-radius:999px;font-size:14px;display:inline-flex;align-items:center;gap:8px;border:1px solid #E2A33B;background:rgba(226,163,59,.12);color:#A8711A;user-select:none;-webkit-user-select:none;touch-action:none}
.unlock .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(226,163,59,.35)}
.unlock span,.unlock svg{position:relative}
.unlock.on{border-color:#3E9E7C;background:rgba(62,158,124,.12);color:#2F8467}
.stopw{display:flex;flex-direction:column;align-items:center;gap:2px}
.stop{height:50px;padding:0 18px;border-radius:10px;border:2px solid #C2453A;background:#D9473A;color:#fff;font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:8px}
.stop:active{transform:translateY(1px)}
.stopw small{font-size:10px;color:#9A9BA1}
.simmenu{position:relative}
.simmenu>button{height:40px;padding:0 12px;border-radius:6px;border:1px dashed #CFCBC4;background:transparent;color:#6B6C73;font-size:13px}
.simpop{position:absolute;right:0;top:46px;z-index:30;background:#F1EFEB;border:1px solid #E7E4DF;border-radius:10px;padding:6px;width:220px;display:flex;flex-direction:column;gap:2px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.simpop button{height:40px;text-align:left;padding:0 12px;border:none;border-radius:6px;background:transparent;color:#3A3B41;font-size:13px}
.simpop button:hover{background:#E7E4DF}
.simpop .lb{font-size:11px;color:#9A9BA1;padding:6px 12px 2px}
/* 模态与提示 */
.modal{position:fixed;inset:0;background:rgba(58,59,65,.32);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{width:min(440px,100%);background:#FFFFFF;border:1px solid #E7E4DF;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;color:#3A3B41}
.dlg h2{margin:0;font-size:19px}.dlg p{margin:0;color:#6B6C73;line-height:1.7;font-size:15px}
.dlg .acts{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#3A3B41;color:#F7F6F3;padding:12px 18px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
/* 驾驶舱 */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px}
.camwrap{position:relative;border-radius:10px;overflow:hidden;background:#F1EFEB;aspect-ratio:16/9;max-width:100%}
.camwrap canvas{width:100%;height:100%;display:block}
.camtag{position:absolute;padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.88);font-size:12px;color:#6B6C73}
.mapbox{background:#F1EFEB;border-radius:10px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.rgtools{position:absolute;right:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rgtools .seg{background:rgba(255,255,255,.9)}.rgtools .seg button{height:30px;padding:0 10px;font-size:12px}
.rgprobe{position:absolute;pointer-events:none;padding:4px 8px;border-radius:6px;background:rgba(58,59,65,.88);color:#F7F6F3;font-size:12px;font-family:var(--mono);white-space:nowrap;z-index:2}
.rglegend{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.9);font-size:12px;font-family:var(--mono);color:#6B6C73}
.rglegend i{width:110px;height:8px;border-radius:4px}
.camwrap.cloud canvas{cursor:grab;touch-action:none}
@media (max-width:760px){.rgtools{top:auto;bottom:10px}}
.dtog{height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--tx2);font-size:13px}
.dtog[aria-pressed="true"]{border-color:#3E9E7C;color:var(--acct);background:var(--mintbg,rgba(62,158,124,.12))}
.detgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.detb{background:var(--s2);border-radius:var(--r2);padding:12px 14px;border-left:4px solid #3E9E7C}.detb.warn{border-left-color:#E2A33B}
.detv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.detv div{display:flex;flex-direction:column;gap:2px;min-width:0}.detv span{font-size:12px;color:var(--tx2)}.detv b{font-family:var(--mono);font-size:22px;font-weight:600}.detv small{font-size:12px;color:var(--tx2);font-weight:400;margin-left:3px}
/* 地图页 */
.maplay{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px}
.wp{width:100%;min-height:54px;padding:8px 12px;border-radius:10px;text-align:left;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--s2);color:var(--tx)}
.wp[aria-pressed="true"]{border-color:var(--acc);background:var(--accbg)}
.wp[disabled]{background:transparent;border-color:transparent;color:var(--tx3);cursor:not-allowed}
.wp .d{width:10px;height:10px;border-radius:50%;background:var(--tx2);flex:none}
.wp[aria-pressed="true"] .d{background:var(--acc)}
.wp .n{display:flex;flex-direction:column;flex:1;min-width:0}.wp .n b{font-family:var(--mono);font-weight:400;font-size:14px}.wp .n small{font-size:12px;color:var(--tx2)}
/* 任务 */
.steps{display:flex;gap:0;padding:14px 20px;border-bottom:1px solid #E7E4DF;overflow-x:auto}
.st{display:flex;align-items:center;flex:1 0 auto;min-width:0}
@media (max-width:1500px){.steps.many .st .l small{display:none}.steps.many .st .ln{margin:0 8px}}
.st .c{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:14px;border:2px solid #E7E4DF;color:#9A9BA1;flex:none}
.st .l{display:flex;flex-direction:column;margin-left:10px;white-space:nowrap}.st .l b{font-size:15px;font-weight:400;color:#9A9BA1}.st .l small{font-size:11px;color:#9A9BA1}
.st .ln{flex:1;height:2px;background:#E7E4DF;margin:0 12px;min-width:12px}
.st.done .c{background:#3E9E7C;border-color:#3E9E7C;color:#F7F6F3}.st.done .l b{color:#3A3B41}.st.done .ln{background:#3E9E7C}
.st.now .c{border-color:#3E9E7C;color:#2F8467;background:rgba(62,158,124,.16)}.st.now .l b{color:#3A3B41;font-weight:700}
.st.bad .c{background:#E0604E;border-color:#E0604E;color:#F7F6F3}.st.bad .l b{color:#C2453A;font-weight:700}
.st:last-child .ln{display:none}
.tasklay{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px}
.log{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.log div{display:flex;gap:10px;font-size:12px}.log .t{font-family:var(--mono);color:#9A9BA1;flex:none}
/* 系统 */
.chk{display:flex;align-items:center;gap:12px;min-height:46px;padding:6px 12px;border-radius:8px;background:var(--s2)}
.chk .b{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;background:#E7E4DF;color:#6B6C73}
.chk.ok .b{background:#3E9E7C;color:#F7F6F3}.chk.warn{background:rgba(226,163,59,.10)}.chk.warn .b{background:#E2A33B;color:#F7F6F3}
.chk .nm{width:120px;flex:none}.chk .ds{flex:1;color:var(--tx2);font-size:13px;min-width:0}.chk .vl{font-family:var(--mono);font-size:13px}
.manual{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 12px;border-radius:8px;background:var(--s2);font-size:14px;cursor:pointer}
.manual input{width:22px;height:22px;accent-color:#3E9E7C;flex:none}
/* 采集助手 */
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.ntg{min-height:40px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--s2);color:var(--tx);font-size:14px;text-align:left;display:flex;align-items:center;gap:8px}
.ntg::before{content:'';width:16px;height:16px;border-radius:4px;border:2px solid #BDB8B0;flex:none}
.ntg[aria-pressed="true"]{border:2px solid #3E9E7C;background:rgba(62,158,124,.16);font-weight:700}
.ntg[aria-pressed="true"]::before{background:#3E9E7C;border-color:#3E9E7C;box-shadow:inset 0 0 0 2px #FFFFFF}
.disp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.disp button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--s2);color:var(--tx2);font-size:15px}
.disp button[aria-pressed="true"]{border:2px solid #3E9E7C;background:rgba(62,158,124,.16);color:var(--tx);font-weight:700}
.disp button[data-k="discard"][aria-pressed="true"]{border-color:#E0604E;background:rgba(224,96,78,.16);color:#B23A2F}
.nhint{font-size:13px;line-height:1.55;padding:8px 10px;border-radius:8px;background:var(--s2);color:var(--tx2)}
.qc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;max-width:520px;gap:6px 10px;font-size:13px;align-items:center}
.qc .y{color:var(--okt)}.qc .n{color:var(--errt);font-weight:700}
.syl{display:grid;grid-template-columns:66px minmax(0,1fr) 56px;align-items:center;gap:3px 10px;padding:5px 0;font-size:13px}
.syl .nm{font-family:var(--mono)}
.syl .tr2{grid-column:1/-1;grid-row:3;height:4px;border-radius:2px;background:var(--line);overflow:hidden}.syl .tr2 i{display:block;height:100%;border-radius:2px}
.syl .tr{grid-column:1/-1;grid-row:2;height:4px;border-radius:2px;background:var(--line);overflow:hidden}.syl .tr i{display:block;height:100%;border-radius:2px}
.syl .sbx{height:28px}.syl .btn{height:28px;width:56px;padding:0;font-size:12px}
.syl .lb2{font-size:12px;text-align:right}
.ep .q{font-size:10px;line-height:1}
.cln{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border-radius:8px;background:var(--s2);font-size:13px}
.cln input{width:20px;height:20px;accent-color:#3E9E7C;flex:none}
.cln .why{font-size:12px}
.coll{display:grid;grid-template-columns:320px minmax(0,1fr) 280px;gap:12px}
.cgrid{display:grid;grid-template-columns:52px repeat(5,minmax(0,1fr));gap:8px}
.cell{height:64px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--bg);border:1px dashed var(--line);font-size:12px;color:var(--tx3)}
.cell b{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--tx2)}
.cell.plan{background:var(--s2);border:1px solid var(--line)}
.cell.ok{color:var(--okt)}.cell.fo{color:var(--warnt)}.cell.f{color:var(--errt)}
.cell.cur{background:rgba(62,158,124,.18);border:3px solid #3E9E7C;color:#3A3B41;font-weight:700}.cell.cur b{color:#3A3B41;font-weight:700}
.eps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.ep{height:56px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid var(--line);background:var(--s2);color:var(--tx2);font-size:12px}
.ep b{font-family:var(--mono);font-weight:400}
.ep.ok{border-color:#3E9E7C;background:rgba(62,158,124,.14);color:#2F8467}
.ep.fo{border-color:#E2A33B;background:rgba(226,163,59,.12);color:#A8711A}
.ep.f{border-color:#E0604E;background:rgba(224,96,78,.12);color:#C2453A}
.ep.cur{border:2px solid #3E9E7C;background:rgba(62,158,124,.16);color:#3A3B41;font-weight:700}
.big{border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%}
.big b{font-size:22px}.big small{font-size:13px}
.big.ok{height:76px;border:none;background:#3E9E7C;color:#F7F6F3}
.big.f{height:76px;border:2px solid #E0604E;background:rgba(224,96,78,.12);color:#B23A2F}.big.f small{color:#C2453A}
.big.r{height:60px;border:1px solid #E7E4DF;background:#F1EFEB;color:#3A3B41}.big.r b{font-size:21px}.big.r small{color:#6B6C73}
.inp{height:44px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--tx);padding:0 10px;width:100%}
.light .inp{background:#fff;height:40px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--tx2)}
.blk{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.bk{border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--s2);border:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:12px}
.bk .sg{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}.bk .sg i{height:6px;border-radius:1px;background:var(--line)}
/* 数据页 */
.dhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:20px}
.dhead h2{margin:0;font-size:26px;text-wrap:balance}.dhead p{margin:6px 0 0;color:var(--tx2);font-size:14px}
.dhead .t{flex:1 1 380px;min-width:0}
.dwrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.dwrap h3{margin:0 0 10px;font-size:18px}
.badge{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.b-info{background:var(--accbg);color:var(--acc)}.grp[hidden]{display:none}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-err{background:var(--errbg);color:var(--err)}.b-idle{background:var(--s2);color:var(--tx2)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:14px}
.ev{display:grid;grid-template-columns:150px repeat(4,minmax(84px,1fr)) 56px;gap:8px;align-items:center;min-width:620px}
.evc{height:62px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
.evc b{font-size:18px}
.evc.ok{background:#E7F5EC;color:#2F8467;border:1px solid #B7E1C5}.evc.f{background:#FDEBDC;color:#D9644F;border:1px solid #F5C9A3}
.evc[aria-pressed="true"]{outline:3px solid #2F8467;outline-offset:1px}
.chip{height:36px;padding:0 12px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:var(--s1);color:var(--tx);display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--accbg)}
/* 演示模式 */
.demo{position:fixed;inset:0;z-index:40;background:#F7F6F3;color:#3A3B41;display:flex;flex-direction:column;gap:24px;padding:calc(28px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 28px max(24px,env(safe-area-inset-left,0px));overflow:auto}
.demo .dh{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.demo h2{margin:0;font-size:clamp(28px,3.4vw,44px)}
.dsteps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.dsteps div{display:flex;flex-direction:column;gap:10px}.dsteps i{height:8px;border-radius:4px;background:#F1EFEB}
.dsteps span{font-size:clamp(15px,1.8vw,26px);color:#9A9BA1}
.dsteps .done i{background:#3E9E7C}.dsteps .done span{color:#6B6C73}.dsteps .now i{background:#3E9E7C}.dsteps .now span{color:#3A3B41;font-weight:700}
.dmain{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,30%);gap:24px;flex:1;min-height:0}
.dsay{display:flex;flex-direction:column;gap:8px}.dsay small{font-size:16px;color:#6B6C73}.dsay div{font-size:clamp(20px,2.2vw,32px);line-height:1.4}
@media (max-width:1100px){
  .dash,.maplay,.tasklay{grid-template-columns:minmax(0,1fr)}
  .coll{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .app{flex-direction:column}
  .side{width:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-right:none;border-bottom:1px solid #E7E4DF;gap:2px}
  .brand{padding:0 8px 0 0}.brand div{display:none}
  .grp,.side .foot,.nav .tag{display:none}
  .side .foot#sideFoot{display:none}
  .pjw{display:none}
  .nav{flex:none;min-height:40px;padding:0 10px;font-size:13px}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));min-height:0}
  .pad{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .dmain{grid-template-columns:minmax(0,1fr)}
  .dsteps span{font-size:13px}
  .cgrid{grid-template-columns:36px repeat(5,minmax(0,1fr));gap:5px}
  .cell{height:64px}
  .eps{grid-template-columns:repeat(4,minmax(0,1fr))}
}
.tabbar{display:none}
body.appui .side{display:none}
body.appui .app{flex-direction:column}
body.appui .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;flex:none;background:#FFFFFF;border-top:1px solid #E7E4DF;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;color:#6B6C73;text-decoration:none;font-size:11px;border-radius:10px}
.tab svg{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-current="page"]{color:#2F8467;background:rgba(62,158,124,.12);font-weight:700}
body.appui .top{min-height:56px;padding:8px 12px calc(8px) max(12px,env(safe-area-inset-left,0px));flex-wrap:nowrap;gap:8px}
body.appui .top h1{font-size:18px;white-space:nowrap}
body.appui .top .pill{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.appui .top .sp{flex:1}
body.appui .simmenu>button{height:36px;padding:0 10px;white-space:nowrap}
body.appui .view{padding-bottom:96px}
body.appui .dhint{display:none}
body.appui #camMeta{display:none}
body.appui .st .l small{display:none}
body.appui .seg button{padding:0 12px}
body.appui .toast{bottom:auto;top:calc(64px + env(safe-area-inset-top,0px))}
body.appui .banner{padding:10px 16px}
.ctrlrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#F1EFEB;border-bottom:1px solid #E7E4DF;color:#6B6C73;font-size:13px}
.ctrlrow .unlock{flex:none;height:44px}
.fabstop{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:95;width:78px;height:78px;border-radius:50%;border:3px solid #C2453A;background:#D9473A;color:#fff;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 6px 22px rgba(214,47,51,.55)}
.fabstop:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 通用状态：右上角图标组 */
.stats{position:relative;display:flex;align-items:center;gap:2px;flex:none}
.stats>button{display:flex;align-items:center;gap:2px;height:36px;padding:0 6px;border:none;border-radius:999px;background:transparent;color:var(--tx2);cursor:pointer}
.stats>button:hover,.stats>button[aria-expanded="true"]{background:var(--s2)}
.si{position:relative;display:inline-flex;align-items:center;gap:4px;height:32px;min-width:30px;justify-content:center;color:var(--tx2)}
.si svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.si b{font:600 12px/1 var(--mono);color:var(--tx2)}
.si.run{color:var(--acc)}.si.warn{color:var(--warn)}.si.warn b{color:var(--warnt)}.si.err{color:var(--err)}.si.err b{color:var(--errt)}.si.off{opacity:.38}
.si.warn::after,.si.err::after{content:"";position:absolute;top:4px;right:2px;width:8px;height:8px;border-radius:50%;border:2px solid var(--s1)}
.si.warn::after{background:var(--warn)}.si.err::after{background:var(--err)}
.statpop{position:absolute;right:0;top:44px;z-index:31;width:280px;background:var(--s1);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(58,59,65,.12);padding:6px}
.statpop div{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px}
.statpop div .si{min-width:24px;height:24px}.statpop div .si b{display:none}
.statpop .pn{color:var(--tx3);flex:none;width:52px}.statpop .pv{font-style:normal;color:var(--tx);flex:1;min-width:0}
.tsep{width:1px;height:24px;background:var(--line);flex:none;margin:0 4px}
body.appui .stats>button{padding:0 2px;gap:0}
body.appui .si{min-width:26px}
body.appui .simmenu>button{padding:0 10px}

/* ===== v3 视觉：贴近 logo —— 暖白底、薄荷绿主色、珊瑚色点缀、圆润扁平 ===== */
:root,.light{color-scheme:light;
  --bg:#F7F6F3;--s1:#FFFFFF;--s2:#F1EFEB;--line:#E9E6E1;--line2:#DCD8D1;
  --tx:#3A3B41;--tx2:#6B6C73;--tx3:#9A9BA1;
  --mint:#9DD4BC;--mintbg:#E8F5EF;--coral:#F4917F;--coralbg:#FDEDE9;
  --acc:#3E9E7C;--acct:#2F8467;--accbg:#E8F5EF;
  --ok:#3E9E7C;--okt:#2F8467;--okbg:#E8F5EF;
  --warn:#E2A33B;--warnt:#A8711A;--warnbg:#FCF2DF;
  --err:#E0604E;--errt:#C2453A;--errbg:#FCEAE6;
  --ser2:#F4917F;--ser2t:#D9644F;--onacc:#FFFFFF;--stop:#D9473A;
  --sans:'Nunito','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --r1:8px;--r2:12px;--r3:14px}
html,body{background:var(--bg);color:var(--tx)}
body{font-size:14px;-webkit-font-smoothing:antialiased}
/* 侧栏 */
.side{background:var(--s1);border-right:1px solid var(--line);padding:16px 12px}
.brand{gap:10px;padding:2px 6px 14px}
.logo{width:42px;height:42px;flex:none;border-radius:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.logo svg{width:100%;height:100%;display:block}
.brand b{font-weight:800;font-size:14px;color:var(--tx);letter-spacing:.01em}.brand small{color:var(--tx3);font-size:11px}
.grp{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--tx3);padding:14px 10px 6px}
.nav{min-height:38px;border-radius:10px;color:var(--tx2);font-size:14px}
.nav:hover{background:var(--s2);color:var(--tx)}
.nav[aria-current="page"]{background:var(--mintbg);color:var(--acct);font-weight:700}
.nav svg{stroke-width:1.8}.nav[aria-current="page"] svg{stroke:var(--acc)}
.nav .tag{background:var(--s2);color:var(--tx3);font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:999px}
.nav[aria-current="page"] .tag{background:#FFFFFF;color:var(--acct)}
.side .foot{color:var(--tx3)}
.pjsel{background:var(--s2);border:1px solid transparent;border-radius:12px;color:var(--tx)}
.pjsel span,.pjsel i{color:var(--tx3)}
.pjpop{background:var(--s1);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(58,59,65,.10)}
.pjpop button{color:var(--tx);border-radius:8px}.pjpop button:hover,.pjpop button[aria-pressed="true"]{background:var(--mintbg)}.pjpop small{color:var(--tx3)}
.smp{background:var(--coralbg);color:#C0563F;border-radius:999px;font-weight:700;font-size:10px;padding:1px 7px}
.uchip{background:var(--s2);color:var(--tx);border-radius:12px}
.uchip .av{background:var(--mint);color:#24453A}.uchip small{color:var(--tx3)}
.uchip button{border-color:var(--line2);color:var(--tx2);border-radius:999px;background:var(--s1)}
.fseg{background:var(--s2);border-radius:999px;padding:3px}.fseg button{border-radius:999px;color:var(--tx2)}
.fseg button[aria-pressed="true"]{background:var(--s1);color:var(--acct);font-weight:700;box-shadow:0 1px 2px rgba(58,59,65,.12)}
/* 顶栏 */
.top,.light .top{background:var(--s1);color:var(--tx);border-bottom:1px solid var(--line);min-height:60px;padding:10px max(18px,env(safe-area-inset-right,0px)) 10px 22px;gap:8px}
.top h1{font-size:18px;font-weight:800;margin-right:10px;color:var(--tx)}
.pill{padding:4px 10px;font-size:12px;font-weight:600;border-radius:999px;gap:6px}
.pill i{width:7px;height:7px}
.p-ok{color:var(--acct);background:var(--mintbg)}.p-info{color:var(--acct);background:var(--mintbg)}
.p-warn{color:var(--warnt);background:var(--warnbg)}.p-err{color:var(--errt);background:var(--errbg)}
.p-idle{color:var(--tx2);background:var(--s2)}
/* 面板 */
.card,.light .card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r3);padding:16px 18px}
.ct b{font-size:15px;font-weight:800;color:var(--tx)}.ct span{font-size:12px;color:var(--tx3)}
.tile,.light .tile{background:var(--s2);border:none;border-radius:var(--r2);padding:12px 14px}
.tile .k{color:var(--tx2)}.tile .v{font-weight:600}
.bar{height:6px;border-radius:999px;background:var(--line)}.bar>i{border-radius:999px;background:var(--acc)}
.kv>span:nth-child(odd){color:var(--tx3)}
/* 按钮：主按钮用 logo 的薄荷绿 */
.btn,.light .btn{height:40px;border-radius:999px;border:1px solid var(--line2);background:var(--s1);color:var(--tx);font-weight:600;padding:0 18px}
.btn:hover{border-color:var(--acc);color:var(--acct)}
.btn.pri{background:var(--mint);border-color:var(--mint);color:#1F3F33;font-weight:800}
.btn.pri:hover{background:#8CCBB0;border-color:#8CCBB0;color:#1F3F33}
.btn.ghost{background:transparent}
.btn.danger{background:var(--s1);border-color:#F1B9AF;color:var(--errt)}
.btn.warn{background:var(--s1);border-color:#EED29E;color:var(--warnt)}
.btn.sm{height:32px;padding:0 14px;font-size:13px}
.seg,.light .seg{background:var(--s2);border:none;border-radius:999px;padding:3px}
.seg button{height:34px;border-radius:999px;color:var(--tx2);padding:0 14px}
.seg button[aria-pressed="true"],.light .seg button[aria-pressed="true"]{background:var(--s1);color:var(--acct);font-weight:700;box-shadow:0 1px 2px rgba(58,59,65,.12)}
.inp,.light .inp{border-radius:10px;background:var(--s1);border:1px solid var(--line2);color:var(--tx);height:40px}
.inp:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--mintbg)}
:focus-visible{outline-color:var(--acc)}
.chip{border-radius:999px;background:var(--s1)}.chip[aria-pressed="true"]{border-color:var(--mint);background:var(--mintbg);color:var(--acct)}
/* 徽标 */
.badge{border-radius:999px;font-weight:700;padding:2px 10px}
.b-ok,.b-info{background:var(--mintbg);color:var(--acct)}.b-warn{background:var(--warnbg);color:var(--warnt)}.b-err{background:var(--errbg);color:var(--errt)}.b-idle{background:var(--s2);color:var(--tx2)}
/* 横幅 */
.banner{font-size:13px;padding:10px 22px;border-bottom:1px solid var(--line)!important}
.banner.err{background:var(--errbg)!important;color:#9E3328!important}.banner.warn{background:var(--warnbg)!important;color:#7A520F!important}
.banner.note{background:var(--mintbg)!important;color:#245E4A!important}
.banner b{font-weight:800}
/* 表格 */
.tw{border-radius:var(--r3);background:var(--s1);border-color:var(--line)}
.tbl th{background:var(--s2);color:var(--tx2);font-weight:700;font-size:12px}
.tbl td{border-top-color:var(--line)}
.dhead h2{font-size:24px;font-weight:800}.dhead p{color:var(--tx3)}
.dwrap h3{font-size:16px;font-weight:800}
/* 解锁、停止 */
.unlock{height:40px;border-radius:999px;border:1px solid #EED29E;background:var(--warnbg);color:var(--warnt);font-weight:700;font-size:13px}
.unlock .fill{background:rgba(226,163,59,.35)}
.unlock.on{border-color:var(--mint);background:var(--mintbg);color:var(--acct)}
.stop{height:42px;border-radius:999px;border:none;background:var(--stop);color:#fff;font-size:15px;font-weight:800;padding:0 20px}
.stop svg rect{fill:#fff}
.stopw small{color:var(--tx3)}
.simmenu>button{height:36px;border-radius:999px;border:1px dashed var(--line2);color:var(--tx3);background:transparent}
.simpop{background:var(--s1);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(58,59,65,.12)}
.simpop button{color:var(--tx);border-radius:8px}.simpop button:hover{background:var(--s2)}.simpop .lb{color:var(--tx3)}
/* 弹窗、提示、登录 */
.dlg{background:var(--s1);border:none;border-radius:18px;color:var(--tx);box-shadow:0 16px 40px rgba(58,59,65,.16)}
.dlg p{color:var(--tx2)}.dlg p b{color:var(--tx)!important}
.toast{background:#3A3B41;color:#FFFFFF;border-radius:999px;box-shadow:0 6px 18px rgba(58,59,65,.2)}
.login{background:var(--bg);color:var(--tx)}
.login .box>div:first-child div div:first-child{color:var(--tx)}
.login .acct{background:var(--s1);border:1px solid var(--line);color:var(--tx);border-radius:12px}
.login .acct small{color:var(--tx3)}.login .acct:hover{border-color:var(--mint)}
.login .acct[aria-pressed="true"]{border:2px solid var(--mint);background:var(--mintbg)}
.login .acct .av{background:var(--mint)!important;color:#1F3F33!important}
.login span[style*="color:#9A9BA1"],.login span[style*="color:#6B6C73"]{color:var(--tx3)!important}
/* 画面与地图：保持暗底，像一块屏幕 */
.camwrap{border-radius:12px;background:var(--s2)}
.camtag{color:var(--tx2)}
.mapbox{border-radius:12px;background:#FBFAF8;border:1px solid var(--line)}
.camtag{border-radius:999px;background:rgba(255,255,255,.9);color:var(--tx2)}
.wp{border-radius:12px;background:var(--s1);border-color:var(--line)}
.wp[aria-pressed="true"]{border-color:var(--mint);background:var(--mintbg)}
.fgx{border-radius:12px;background:var(--s1);border-color:var(--line);color:var(--tx2)}
.fgx .bar{background:var(--s2);border-bottom-color:var(--line)}.fgx .fgt{background:#F7F6F3;border-color:var(--line)}
/* 任务步骤 */
.steps{background:var(--s1);border-bottom:1px solid var(--line)}
.st .c{border:2px solid var(--line2);color:var(--tx3);background:var(--s1)}
.st .l b{color:var(--tx3)}.st .l small{color:var(--tx3)}.st .ln{background:var(--line2)}
.st.done .c{background:var(--mint);border-color:var(--mint);color:#1F3F33}.st.done .l b{color:var(--tx2)}.st.done .ln{background:var(--mint)}
.st.now .c{background:var(--s1);border-color:var(--acc);color:var(--acct)}.st.now .l b{color:var(--tx);font-weight:800}
.st.bad .c{background:var(--err);border-color:var(--err);color:#fff}.st.bad .l b{color:var(--errt)}
/* 列表块 */
.chk,.manual,.cln{background:var(--s2);border-radius:12px}
.chk .b{background:var(--line2);color:var(--tx2)}.chk.ok .b{background:var(--mint);color:#1F3F33}.chk.warn{background:var(--warnbg)}.chk.warn .b{background:var(--warn);color:#fff}
.manual input{accent-color:var(--acc)}.cln input{accent-color:var(--acc)}
.nhint{background:var(--s2);border-radius:10px}
.ntg,.disp button{border-radius:12px;background:var(--s1)}
.ntg::before{border-color:var(--line2);border-radius:6px}
.ntg[aria-pressed="true"],.disp button[aria-pressed="true"]{border:2px solid var(--mint);background:var(--mintbg);color:var(--tx)}
.ntg[aria-pressed="true"]::before{background:var(--acc);border-color:var(--acc);box-shadow:inset 0 0 0 2px #fff}
.cell,.ep,.bk{border-radius:12px}
.cell.cur,.ep.cur{background:var(--mintbg);border:2px solid var(--acc);color:var(--tx)}.cell.cur b{color:var(--tx)}
.big{border-radius:18px}.big.ok{background:var(--mint);color:#1F3F33}.big.f{background:var(--errbg);border-color:#F1B9AF;color:#9E3328}
.big.r{background:var(--s1);border-color:var(--line2);color:var(--tx)}
.evc{border-radius:12px}.evc.ok{background:var(--mintbg);color:var(--acct);border-color:#C6E6D8}.evc.f{background:var(--coralbg);color:#C0563F;border-color:#F6C9BF}
.evc[aria-pressed="true"]{outline:2px solid var(--acc)}
.capc{border-radius:999px}
/* 演示大屏 */
.demo{background:var(--bg);color:var(--tx)}.dsteps i{background:var(--line);border-radius:999px}
.dsteps .done i{background:var(--mint)}.dsteps .now i{background:var(--acc)}.dsteps span{color:var(--tx3)}.dsteps .now span{color:var(--tx)}
.dsay small{color:var(--tx3)}
/* APP */
.tabbar{background:var(--s1)!important;border-top:1px solid var(--line)!important}
.tab{color:var(--tx3);border-radius:14px;font-weight:600}.tab[aria-current="page"]{background:var(--mintbg);color:var(--acct)}

.msg.bot .wave i.on{background:#D9705D}
.vdur{font-size:12px;color:var(--tx2);font-family:var(--mono,ui-monospace,monospace);flex:none}
.vtxt{font-size:15px;line-height:1.55;color:var(--tx);border-top:1px dashed var(--line2);padding-top:6px}

.vtxt.partial{color:var(--tx3)}
.mmeta{font-size:11px;color:var(--tx3);padding:0 6px}
.mtag{display:inline-block;font-size:11px;font-weight:700;color:#B45A49;background:var(--coralbg);border-radius:999px;padding:0 8px;margin-right:4px}
.typing{display:flex;gap:4px;padding:6px 2px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--tx3);animation:tdot 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{opacity:.25}30%{opacity:1}}
.pttbar{position:sticky;bottom:0;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--s1);z-index:2}
.ptt{width:88px;height:88px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:13px;font-family:inherit;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;box-shadow:0 6px 18px rgba(62,158,124,.35);transition:transform .12s,background .12s}

.ptt.rec{background:var(--coral);transform:scale(1.08);box-shadow:0 0 0 10px var(--coralbg)}
.ptt.off{background:var(--line2);box-shadow:none;cursor:not-allowed}

.ptthint b{color:#B45A49}
</style>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const now=()=>performance.now()/1000;
const clock=()=>{const d=new Date();return d.toTimeString().slice(0,8)};
const pad2=n=>n<10?'0'+n:''+n;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtS=(v,d=1)=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(d);

/* ---------------- 地图与点位（像素坐标，0.02 m/px） ---------------- */
const WP=[
  {id:'home',desc:'开机位 / 待命位',x:90,y:470,yaw:0},
  {id:'table_1_pre',desc:'取水桌 1 预停靠 · 到点后精对位',x:630,y:205,yaw:-90,dock:'table_1'},
  {id:'table_1',desc:'精对位终点，不能直接下发',x:630,y:162,yaw:-90,locked:true},
  {id:'table_2_pre',desc:'取水桌 2 预停靠 · 到点后精对位',x:655,y:345,yaw:90,dock:'table_2'},
  {id:'table_2',desc:'精对位终点，不能直接下发',x:655,y:385,yaw:90,locked:true},
  {id:'demo_1',desc:'演示接令位 1',x:420,y:330,yaw:180},
  {id:'demo_2',desc:'演示接令位 2',x:180,y:220,yaw:0}
];
const wpById=id=>WP.find(w=>w.id===id);
const toM=(x,y)=>({x:(x-90)*0.02,y:-(y-470)*0.02});

/* ---------------- 模拟状态 ---------------- */
const S={
  online:true,loc:'ok',locT:0,
  unlockUntil:0,holdStart:0,
  pose:{x:90,y:470,yaw:-20},
  nav:null,       // {goal,label,pts,carry,dockTo,phase,t}
  selWp:'table_1_pre',pickMode:false,
  battery:76.0,charging:false,
  res:{cpu:[],gpu:[],mem:[],temp:[]},lastRes:0,
  stopAt:0,
  task:{step:0,t:0,retry:0,fail:false,injectFail:false,p:0,grip:0,tau:0,ret:null,logs:[],done:0,voice:null},
  chat:[],talk:{rec:false,start:0,dy:0,utt:null,wait:0,play:null,playT:0,key:''},
  cam:'head',
  sysTab:'check',check:null,manual:[true,true,true,false,true,false],
  menu:false
};
for(let i=0;i<60;i++){S.res.cpu.push(20+Math.random()*8);S.res.gpu.push(12+Math.random()*6);S.res.mem.push(56+Math.random()*2);S.res.temp.push(68+i*0.15)}
const unlocked=()=>S.unlockUntil>now();
function log(m,c){S.task.logs.unshift({t:clock(),m,c:c||''});if(S.task.logs.length>50)S.task.logs.pop()}
log('系统启动，等待指令');

/* 路径规划（示意）：跨中墙走门洞，跨右侧横墙绕墙端 */
function plan(from,to){
  const pts=[{x:from.x,y:from.y}];
  const leftA=from.x<300,leftB=to.x<300;
  if(leftA!==leftB){pts.push({x:leftA?260:340,y:240},{x:leftA?340:260,y:240})}
  const upA=from.y<300&&from.x>300,upB=to.y<300&&to.x>300;
  const dnA=from.y>300&&from.x>480,dnB=to.y>300&&to.x>480;
  if((upA&&dnB)||(dnA&&upB)||(leftA&&dnB)||(dnA&&leftB)){pts.push({x:470,y:320})}
  pts.push({x:to.x,y:to.y});
  return pts;
}
function pathLen(pts){let l=0;for(let i=1;i<pts.length;i++)l+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);return l}
function startNav(goal,opt={}){
  const pts=plan(S.pose,goal);
  S.nav={goal,label:goal.id||'地图点',pts,carry:!!opt.carry,dockTo:goal.dock?wpById(goal.dock):null,phase:'nav',t:0,onDone:opt.onDone||null};
  log('导航到 '+(goal.id||'地图点'),'#2F8467');
}
function cancelNav(reason){if(S.nav){log('导航已取消'+(reason?'：'+reason:''),'#A8711A');S.nav=null}}
function navRemain(){if(!S.nav)return 0;return pathLen(S.nav.pts)*0.02+(S.nav.dockTo&&S.nav.phase==='nav'?0.86:0)}

/* ---------------- 取水任务流程 ---------------- */
function startTask(src){
  const T=S.task;
  if(PJ().sample){toast('示例机器人未接入，不能运行任务');return}
  if(T.step!==0&&T.step!==6&&T.step!==9){toast('任务正在执行');return}
  Object.assign(T,{step:1,t:0,retry:0,fail:false,p:0,grip:0,tau:0,ret:{x:S.pose.x,y:S.pose.y,yaw:S.pose.yaw,id:'return'}});
  const vo=src==='voice'||src==='talk';
  T.voice={heard:vo?'“小七，帮我拿瓶水”':'（网页触发）',intent:'fetch_water',conf:vo?0.93:1,reply:'“好的，我去给您拿水。”'};
  if(src==='voice'){chatPush('me','小七，帮我拿瓶水',{conf:0.93});chatPush('bot','好的，我去给您拿水。',{reply:true})}
  log(vo?'对讲意图 fetch_water · 0.93':'网页触发拿水','#2F8467');
  log('记录返回点 return，开始任务 fetch_water');
}
function stopTask(reason){
  const T=S.task;
  if(T.step>=1&&T.step<=5){log('任务已停止'+(reason?'：'+reason:''),'#C2453A');T.step=0;T.p=0;T.grip=0;T.tau=0}
}
function taskTick(dt){
  const T=S.task;T.t+=dt;
  if(T.step===1&&T.t>1.6){T.step=2;T.t=0;startNav(wpById('table_1_pre'),{onDone:()=>{log('精对位完成 · 误差 1.8 cm / 0.9°','#2F8467');T.step=3;T.t=0;T.p=0;log('vla_skill 开始抓取 · chunk 0/40')}})}
  else if(T.step===3){
    T.p=clamp(T.t/9,0,1);
    T.grip=T.p<0.62?0:clamp((T.p-0.62)/0.15,0,1)*(T.injectFail?0.98:0.91);
    if(T.p>=1){
      if(T.injectFail){
        if(T.retry<1){T.retry++;T.t=0;T.p=0;T.grip=0;log('未抓到瓶子，回到抓取准备重试 1 次','#A8711A')}
        else{T.step=9;T.t=0;T.grip=0;log('抓取失败：重试 1 次后仍未抓到','#C2453A');log('已收臂、播报原因，故障快照已保存','#C2453A');T.voice&&(T.voice.reply='“抱歉，我没拿到水。”');chatPush('bot','抱歉，这次没拿到水。',{pro:true})}
      }else{
        T.step=4;T.t=0;log('确认抓到 · 夹爪开度 0.91','#2F8467');
        startNav(T.ret,{carry:true,onDone:()=>{T.step=5;T.t=0;T.tau=0;log('伸到递交姿态，采集 tau 基准');T.voice&&(T.voice.reply='“请拿水。”');chatPush('bot','您的水，请拿好。',{pro:true})}});
      }
    }
  }
  else if(T.step===5){
    if(T.t<2.5)T.tau=0.15+Math.sin(T.t*7)*0.06;
    else T.tau=Math.min(2.2,T.tau+dt*1.4);
    if(T.tau>1.5&&!T.rel){T.rel=T.t}
    if(T.rel&&T.t-T.rel>0.2&&T.grip>0){T.grip=0;log('检测到拉力 · 张爪','#2F8467')}
    if(T.rel&&T.t-T.rel>1.4){T.step=6;T.t=0;T.rel=0;T.done++;log('收臂，任务完成','#2F8467')}
  }
  else if(T.step===6&&T.t>6){T.step=0;T.t=0}
}

let last=now();
function tick(){
  const t=now(),dt=Math.min(0.25,t-last);last=t;
  if(S.online){
    // 导航
    if(S.nav&&S.loc==='ok'){
      const N=S.nav;N.t+=dt;
      if(N.phase==='nav'){
        let step=(N.carry?52:78)*dt;
        while(step>0&&N.pts.length>1){
          const a=N.pts[0],b=N.pts[1],d=Math.hypot(b.x-a.x,b.y-a.y);
          if(d<=step){N.pts.shift();step-=d;}else{a.x+=(b.x-a.x)/d*step;a.y+=(b.y-a.y)/d*step;step=0}
          S.pose.x=N.pts[0].x;S.pose.y=N.pts[0].y;
          if(N.pts.length>1){const c=N.pts[1];const tgt=Math.atan2(c.y-S.pose.y,c.x-S.pose.x)*180/Math.PI;S.pose.yaw+=((((tgt-S.pose.yaw)%360)+540)%360-180)*Math.min(1,dt*6)}
        }
        if(N.pts.length<=1){
          if(N.goal.yaw!==undefined)S.pose.yaw=N.goal.yaw;
          if(N.dockTo){N.phase='dock';N.t=0;N.dockFrom={x:S.pose.x,y:S.pose.y};log('到达 '+N.label+'，AprilTag 精对位')}
          else{log('到达 '+N.label,'#2F8467');const cb=N.onDone;S.nav=null;cb&&cb();if(!cb)toast('已到达 '+N.label)}
        }
      }else if(N.phase==='dock'){
        const k=clamp(N.t/2.6,0,1);S.pose.x=N.dockFrom.x+(N.dockTo.x-N.dockFrom.x)*k;S.pose.y=N.dockFrom.y+(N.dockTo.y-N.dockFrom.y)*k;
        if(k>=1){const cb=N.onDone;const lb=N.dockTo.id;S.nav=null;if(cb)cb();else{log('精对位完成 · 到达 '+lb,'#2F8467');toast('已停靠 '+lb)}}
      }
    }
    if(S.loc==='init'){S.locT+=dt;if(S.locT>3){S.loc='ok';log('定位恢复 Localized','#2F8467');toast('定位已恢复')}}
    taskTick(dt);rgDetTick();
    S.battery=Math.max(5,S.battery-dt*(S.nav?0.012:0.004));
    if(t-S.lastRes>1){S.lastRes=t;const busy=S.task.step===3?1:0;const R=S.res;
      R.cpu.push(clamp(R.cpu.at(-1)+(Math.random()-.5)*4+(S.nav?1:0),12,60)).toFixed;R.gpu.push(clamp(busy?55+Math.random()*12:14+Math.random()*8,0,100));R.mem.push(clamp(R.mem.at(-1)+(Math.random()-.5),50,70));R.temp.push(clamp(R.temp.at(-1)+(busy?0.5:-0.15)+(Math.random()-.5)*.3,62,84));
      for(const k in R)if(R[k].length>60)R[k].shift();}
    if(S.check&&S.check.running){S.check.t+=dt;const n=Math.floor(S.check.t/0.28);if(n>S.check.n){S.check.n=n;if(n>=CHECKS.length){S.check.running=false;S.check.at=clock()}}}
  }
  if(!unlocked()&&S.wasUnlocked){S.wasUnlocked=false;toast('控制已自动上锁')}
  if(unlocked())S.wasUnlocked=true;
  renderTop();renderBanners();
  const v=VIEWS[cur];if(!offPage())v&&v.tick&&v.tick();
  if(S.holdStart){const k=clamp((t-S.holdStart)/1.5,0,1);const f=$('#unlock .fill');if(f)f.style.width=(k*100)+'%';if(k>=1){S.holdStart=0;S.unlockUntil=t+60;toast('已解锁，60 秒无操作自动上锁');renderTop(true)}}
  if(collectUndo&&collectUndo.until<t){collectUndo=null;if(cur==='collect')renderView()}
  syncTick();
  requestAnimationFrame(tick);
}

function qcInner(q,why){

  return `<div class="ct" style="margin:0"><b>快检</b>${why.length?pill('err','不合格'):pill('ok','合格')}</div>

  ${why.length?`<div style="font-size:14px;font-weight:700;color:var(--errt);line-height:1.5">${why.join('；')}。请当场重做这一条。</div>`:''}`}
function cMark(kind){

  const n=noteOf(i);if(kind!=='redo'&&noteErr(n)){toast(noteErr(n));const t=$('#ntTxt');t&&t.focus();return}
  const ntx=n.tags.length?' · 备注：'+n.tags.join('、'):'';
  if(kind==='ok'){C.st[i]=C.redo===i?'fo':'ok';C.redo=-1;advance();collectUndo={msg:id+' 已记为成功'+ntx,prev,until:now()+10}}

  send('episode.result '+id+' '+({ok:'成功',fail:'失败',redo:'废弃重做'})[kind]+(n.tags.length?' · '+n.tags.join('、'):'')+' · '+DISP[kind==='redo'?'discard':n.disp]);

  else send('episode.set '+cid(C.cur));
  renderView();
}

    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><span style="font-size:13px;color:var(--tx2)">对比（最多 2 个）</span>${all.map(k=>`<button type="button" class="chip mono" data-act="ckpick" data-k="${k}" aria-pressed="${sel.includes(k)}"><span style="width:14px;height:3px;border-radius:2px;background:${col(k)}"></span>ckpt ${k}</button>`).join('')}<span style="display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);margin-left:8px"><span style="width:14px;height:3px;background:#111827"></span>示教真值</span></div>
    <div class="tw"><table class="tbl" style="min-width:820px;font-size:14px"><thead><tr><th>checkpoint</th><th class="r">val loss</th><th class="r">关节 MAE（val）</th><th class="r">夹爪闭合时刻误差</th><th class="r">test 集 MAE</th><th>上机评测</th></tr></thead><tbody>${all.map(k=>`<tr style="${sel.includes(k)?'background:#F3FAF6':''}"><td class="mono"><span style="display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:8px;background:${col(k)}"></span>ckpt ${k}</td>${stats[k].slice(0,4).map(v=>`<td class="mono r">${v}</td>`).join('')}<td>${stats[k][4]!=='—'&&stats[k][4]!=='未评'?`<a href="#eval" style="color:var(--acc)">${stats[k][4]}</a>`:stats[k][4]}</td></tr>`).join('')}</tbody></table></div>

    if(v<0&&((i===7||j===7)&&(i<8&&j<8)||(i===7&&j>=N-8)||(j===7&&i>=N-8)||(i<8&&j===N-8)||(i===N-8&&j<8)))v=0;if(v<0)v=r();if(v)cell.push(`M${j} ${i}h1v1h-1z`)}

  'sim-agent'(){S.menu=false;agToggle()},
  'sim-wan'(){S.menu=false;wanToggle()},
  'sim-syncfail'(){S.menu=false;SY.failNext=!SY.failNext;toast(SY.failNext?'下一块上传到采集电脑后会校验失败':'已取消');renderView()},
  syp(el){const b=SY.blocks.find(x=>x.id===el.dataset.id);pauseSync(b,'manual');send('sync.pause '+b.id+'（手动）');renderView()},
  sys(el){const b=SY.blocks.find(x=>x.id===el.dataset.id);startSync(b,b.st==='idle'?'手动发起':'继续');renderView()},
  syr(el){const b=SY.blocks.find(x=>x.id===el.dataset.id);b.p=Math.min(b.p,0.9);startSync(b,'重试');renderView()},
  ntag(el){const n=noteOf(C.cur);const k=el.dataset.k;const on=n.tags.includes(k);n.tags=on?n.tags.filter(x=>x!==k):n.tags.concat(k);if(!on&&k==='首尾多余动作'&&n.disp==='keep')n.disp='trim';renderView();if(!on&&k==='其他'){const t=$('#ntTxt');t&&t.focus()}},
  ndisp(el){noteOf(C.cur).disp=el.dataset.k;renderView()},
  'sim-qcfail'(){S.menu=false;C.qFailNext=!C.qFailNext;toast(C.qFailNext?'下一条录完会快检不合格':'已取消');renderView()},
  dayfull(){S.menu=false;if(!AG.on){toast('断线中，不能下发');return}send('day.sync 11-05 → 采集电脑（收工全量同步）');SY.day='run';SY.dayT=now()+4;toast('已下发收工全量同步（模拟 4 秒），之后转发队列继续送到训练服务器');renderView()},
  clsel(el){CL.sel[el.dataset.id]=el.checked;const c=$('#pgClean');if(c){c.innerHTML=cleanCard();c._h=c.innerHTML}},
  clean(){const rows=cleanSel();if(!rows.length)return;const gb=rows.reduce((a,r)=>a+r.gb,0);const T=rows.filter(r=>r.k[0]==='T'),P=rows.filter(r=>r.k[0]==='P');
    confirmDlg('清理 '+rows.length+' 个会话目录？','删除前会再向训练服务器核对一次校验和与入库状态，通过后才删除，删除后不能恢复。'+(T.length?'机器人上 '+T.length+' 项由采集服务执行；':'')+(P.length?'采集电脑缓存 '+P.length+' 项由本机转发服务执行；':'')+'共释放约 '+gb.toFixed(1)+' GB。','确认清理',()=>{CL.busy=1;CL.sel={};
      if(T.length){const ids=T.map(r=>r.id),g=T.reduce((a,r)=>a+r.gb,0);send('clean.request 机器人 '+ids.join('、'));setTimeout(()=>report('clean.done 机器人 '+ids.join('、')+' · 释放 '+g.toFixed(1)+' GB · 剩余 '+(CL.thor+g).toFixed(0)+' GB',()=>{CL.T=CL.T.filter(r=>!ids.includes(r.id));CL.thor+=g;CL.busy=0;toast('机器人已清理 '+g.toFixed(1)+' GB');if(cur==='progress')renderView()}),1500)}
      if(P.length){const ids=P.map(r=>r.id),g=P.reduce((a,r)=>a+r.gb,0);setTimeout(()=>{fx('clean 采集电脑缓存 '+ids.join('、')+' · 释放 '+g.toFixed(1)+' GB');CL.P=CL.P.filter(r=>!ids.includes(r.id));CL.pc+=g;if(!T.length)CL.busy=0;toast('采集电脑缓存已清理 '+g.toFixed(1)+' GB');if(cur==='progress')renderView()},1000)}
      renderView()})},
  nextblock(){C.st=['','','','','','','',''];C.q=[null,null,null,null,null,null,null,null];C.nt=[];C.cur=0;C.redo=-1;C.before+=8;send('episode.set '+cid(0)+'（原型重置本块）');toast('原型只演示 E1-B07，已重置本块');renderView()},
  addissue(){C.issues=(C.issues||[['10:52','E1-B05 dx −8 时右臂够 C1 吃力，3 条里 2 条重录'],['11:30','窗边日光变化快，L3 照度在 900–1600 lux 波动']]);C.issues.unshift([clock().slice(0,5),'（新问题，点这里编辑）']);renderView()},
  calmode(el){VIEWS.calib.mode=el.dataset.k;renderView()},
  calapply(){const c=VIEWS.calib.cur;if(c){C.meas={dx:+c.dx.toFixed(1),dy:+c.dy.toFixed(1),dth:+c.dth.toFixed(1),tor:-0.271}}toast('已写入 E1-B07 实测列');location.hash='collect'},
  caldock(){VIEWS.calib.dockN=(VIEWS.calib.dockN||6)+1;if(VIEWS.calib.dockN>=10){toast('10 次已记满：成功 10/10，均值 1.7 cm / 0.8°');VIEWS.calib.dockN=0}else toast('已记录第 '+VIEWS.calib.dockN+' 次');renderView()},
  setp0(){if(!needUnlock())return;confirmDlg('设为 P0？','将把机器人当前位姿写为 table_1 的停靠点 P0。之后的采集偏移都以它为原点。','写入 P0',()=>toast('已写入 P0（原型）'))},
  seth0(){if(!needUnlock())return;confirmDlg('设为 H0？','将把当前升降读数写为 table_1 的 h0。','写入 H0',()=>toast('已写入 H0（原型）'))},
  qcset(el){QC.flag[+el.dataset.i][2]=el.dataset.v;renderView()},
  dsf(el){VIEWS.dataset[el.dataset.f]=el.dataset.k;renderView()},
  evpick(el){EV.sel=el.dataset.id;renderView()},
  evset(el){const r=EV.res[EV.sel];EV.res[EV.sel]=el.dataset.v==='ok'?['ok']:['f',r[1]||'没对准'];renderView()},
  evtag(el){EV.res[EV.sel]=['f',el.dataset.k];renderView()},
  ckpick(el){const k=el.dataset.k;let s=CK.sel.slice();if(s.includes(k)){if(s.length>1)s=s.filter(x=>x!==k)}else{s.push(k);if(s.length>2)s.shift()}CK.sel=s;renderView()},
  toast(el){toast(el.dataset.m)}
};
document.addEventListener('input',e=>{if(e.target.id==='ntTxt'){const n=noteOf(C.cur);n.txt=e.target.value;const er=noteErr(n);const m=$('#ntErr');if(m){m.textContent=er;m.style.display=er?'':'none'}e.target.style.border=er?'2px solid #E0604E':''}});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(S.pjOpen&&!e.target.closest('.pjw')){S.pjOpen=false;renderPj()}
  if(S.statOpen&&!e.target.closest('.stats')){S.statOpen=false;renderTop(true)}
  if(!el){if(S.menu&&!e.target.closest('.simmenu')){S.menu=false;renderTop(true)}return}
  if(el.id==='unlock')return;
  if(ACC.form==='web'&&UPLOAD_ACTS.includes(el.dataset.act)){e.preventDefault();toast('上传和清理请在装了桌面客户端的采集电脑上进行');return}
  const f=A[el.dataset.act];if(!f)return;
  if(!permit(el.dataset.act)){e.preventDefault();return}
  if(el.tagName==='INPUT'){f(el,e);return}
  e.preventDefault();f(el,e);
});
document.addEventListener('change',e=>{const el=e.target.closest('input[data-act]');if(el&&permit(el.dataset.act,true))A[el.dataset.act]&&A[el.dataset.act](el)});
// 长按解锁
document.addEventListener('pointerdown',e=>{const u=e.target.closest('#unlock');if(!u)return;if(unlocked()){S.unlockUntil=0;toast('已上锁');renderTop(true);return}if(!S.online){toast('与机器人断开，不能解锁');return}S.holdStart=now();u.setPointerCapture&&u.setPointerCapture(e.pointerId)});
const endHold=()=>{if(S.holdStart){S.holdStart=0;const f=$('#unlock .fill');if(f)f.style.width='0';toast('按住不放 1.5 秒才能解锁')}};
document.addEventListener('pointerup',endHold);document.addEventListener('pointercancel',endHold);
document.addEventListener('keydown',e=>{const u=e.target.closest&&e.target.closest('#unlock');if(u&&(e.key===' '||e.key==='Enter')&&!e.repeat&&!unlocked()){S.holdStart=now();e.preventDefault()}});
document.addEventListener('keyup',e=>{if(e.target.closest&&e.target.closest('#unlock'))endHold()});


/* ---------------- 语音对讲（聊天式） ---------------- */
let chatId=0;
function chatPush(who,txt,o={}){const dur=o.dur||Math.max(1.0,Math.min(12,txt.length*0.28+0.6));S.chat.push({id:++chatId,who,txt,dur,t:clock().slice(0,5),conf:o.conf,pro:!!o.pro,reply:!!o.reply});if(S.chat.length>60)S.chat.shift();S.talk.key=''}
chatPush('bot','我是小七。在这里按住下面的按钮跟我说话，松开就发送。',{reply:true});
chatPush('me','你好',{conf:0.97});
chatPush('bot','你好，我是小七，可以帮你拿水。',{reply:true});
function pickUtt(){const busy=S.task.step>=1&&S.task.step<=5;return busy?{txt:'你现在在干什么',intent:'chat',reply:'我正在拿水，请稍等。'}:{txt:'小七，帮我拿瓶水',intent:'fetch_water',reply:'好的，我去给您拿水。'}}
function waveBars(m,on){const n=Math.round(clamp(m.dur*7,12,30));let h='',x=m.id*7919;for(let i=0;i<n;i++){x=(x*1103515245+12345)%2147483648;const v=6+(x%1000)/1000*20;h+=`<i style="height:${v.toFixed(0)}px" class="${i<on*n?'on':''}"></i>`}return h}
const PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
function fmtDur(d){return '0:'+pad2(Math.max(1,Math.round(d)))}
function msgHTML(m){const me=m.who==='me',pl=S.talk.play===m.id;
  const meta=me?`我 · ${m.t}${m.conf?' · 置信度 '+m.conf.toFixed(2):''}`:`${m.pro?'<span class="mtag">主动播报</span>':''}小七 · ${m.t} · ${m.pro?'机器人音箱':'手机 + 机器人音箱'}`;
  return `<div class="msg ${me?'me':'bot'}"><div class="bub"><div class="vrow"><button type="button" class="vplay" data-act="vplay" data-id="${m.id}" aria-label="${pl?'停止回放':'回放这条语音'}">${pl?PAUSE:PLAY}</button><span class="wave" id="wv${m.id}">${waveBars(m,0)}</span><span class="vdur">${fmtDur(m.dur)}</span></div><div class="vtxt">${esc(m.txt)}</div></div><div class="mmeta">${meta}</div></div>`}
function talkOk(){if(!S.online)return '与机器人断开，对讲不可用';if(level('live')!=='full')return '当前角色只能查看，不能对讲';return ''}
VIEWS.talk={
  render(){return `<div class="talk"><div class="chat" id="chat" aria-live="polite"></div>
    <div class="pttbar"><button type="button" class="ptt" id="ptt" aria-label="按住说话"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="pttL">按住说话</span></button><div class="ptthint" id="pttH"></div></div></div>`},
  mount(){$('#view').classList.add('talkv');S.talk.key=''},
  unmount(){$('#view').classList.remove('talkv');talkEnd(true);stopPlay()},
  tick(){const K=S.talk,t=now();
    if(K.wait&&t>=K.wait){K.wait=0;const u=K.utt;chatPush('bot',u.reply,{reply:true});if(u.intent==='fetch_water'){startTask('talk')}}
    const el=t-K.start,shown=K.rec?Math.min(K.utt.txt.length,Math.floor(Math.max(0,el-0.5)/0.22)):0;
    const key=S.chat.length+'|'+chatId+'|'+K.rec+'|'+shown+'|'+(K.wait?1:0)+'|'+K.play+'|'+(K.rec?Math.floor(el):0)+'|'+K.dy;
    const box=$('#chat');
    if(box&&K.key!==key){K.key=key;
      let h='<div class="cday">今天 · 与 '+PJ().robot+' 的对话 · 记录只存在这台手机上</div><div class="cday" style="background:none">对讲启动任务不需要解锁 · 停止机器人请用快速停止</div>'+S.chat.map(msgHTML).join('');
      if(K.rec)h+=`<div class="msg me"><div class="bub"><div class="vrow"><span class="vplay" style="background:var(--coral)">${PAUSE}</span><span class="wave">${waveBars({id:99,dur:Math.max(1.5,el)},1)}</span><span class="vdur">${fmtDur(el)}</span></div><div class="vtxt partial">${shown?esc(K.utt.txt.slice(0,shown))+'…':'正在听…'}</div></div><div class="mmeta">边说边出字 · 灰字为中间结果</div></div>`;
      if(K.wait)h+=`<div class="msg bot"><div class="bub" style="min-width:0"><div class="typing"><i></i><i></i><i></i></div></div><div class="mmeta">小七正在理解…</div></div>`;
      box.innerHTML=h;const v=$('#view');v.scrollTop=v.scrollHeight;
      const no=talkOk(),b=$('#ptt');b.className='ptt'+(K.rec?' rec':'')+(no?' off':'');$('#pttL').textContent=K.rec?(K.dy>60?'松开取消':'松开发送'):'按住说话';
      $('#pttH').innerHTML=no?no:K.rec?(K.dy>60?'<b>松开取消这句话</b>':'说完松开发送 · 上滑取消'):'按住说话 · 松开发送 · 上滑取消';
    }
    if(K.play){const m=S.chat.find(c=>c.id===K.play),w=$('#wv'+K.play);if(!m){K.play=null}else{const f=(t-K.playT)/m.dur;if(f>=1){stopPlay()}else if(w){const bars=w.children;const n=bars.length;for(let i=0;i<n;i++)bars[i].classList.toggle('on',i<f*n)}}}
  }
};
function stopPlay(){if(S.talk.play){S.talk.play=null;S.talk.key='';try{speechSynthesis.cancel()}catch(e){}}}
function talkEnd(cancel){const K=S.talk;if(!K.rec)return;K.rec=false;const el=now()-K.start;K.key='';
  if(cancel||K.dy>60){toast('已取消，这句话没有发送');return}
  if(el<0.3){toast('按住说话，时间太短');return}
  if(el<1.8){toast('原型里请多按住一会儿，等文字出完再松开');return}
  chatPush('me',K.utt.txt,{conf:0.93,dur:el});K.wait=now()+1.3;log('对讲：'+K.utt.txt,'#2F8467')}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('#ptt');if(!b)return;e.preventDefault();const no=talkOk();if(no){toast(no);return}
  stopPlay();const K=S.talk;K.rec=true;K.start=now();K.dy=0;K.y0=e.clientY;K.utt=pickUtt();K.key='';try{navigator.vibrate&&navigator.vibrate(30)}catch(x){}b.setPointerCapture&&b.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{const K=S.talk;if(!K.rec)return;K.dy=Math.max(0,(K.y0||0)-e.clientY)});
document.addEventListener('pointerup',()=>talkEnd(false));document.addEventListener('pointercancel',()=>talkEnd(true));
A.vplay=function(el){const id=+el.dataset.id,K=S.talk;if(K.rec)return;if(K.play===id){stopPlay();return}stopPlay();K.play=id;K.playT=now();K.key='';
  const m=S.chat.find(c=>c.id===id);try{const u=new SpeechSynthesisUtterance(m.txt);u.lang='zh-CN';speechSynthesis.speak(u)}catch(x){}};
try{matchMedia('(max-width:820px)').addEventListener('change',()=>{topKey='';route()})}catch(e){}
renderLogin();route();requestAnimationFrame(tick);
})();
</script>
